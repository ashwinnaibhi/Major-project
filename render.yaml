services:
  # HaemoPulse Unified FastAPI Backend + ML Prediction Engine
  - type: web
    name: haemopulse-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_BASE_URL
        value: https://haemopulse.ashwinkumarnsrao.workers.dev
      - key: ALLOWED_ORIGINS
        value: https://haemopulse.ashwinkumarnsrao.workers.dev,https://haemopulse.pages.dev,https://haemopulse.vercel.app
      - key: HAEMOPULSE_DISABLE_EXTERNAL_MESSAGES
        value: "false"

      # Persistent Neon PostgreSQL Database Connection String
      # Set in Render dashboard: postgresql://user:password@ep-xyz.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false

      # Email Delivery Method: Use 'brevo' or 'resend' for HTTPS API delivery over port 443
      # (Render free tier blocks outbound SMTP ports 25, 465, and 587)
      - key: EMAIL_DELIVERY_METHOD
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        value: ashwinkumarnsrao@gmail.com
      - key: MAIL_FROM_NAME
        value: HaemoPulse Blood Bank
