spring.application.name=blood-bank-backend
server.port=8080

# MongoDB Configuration (NoSQL Document Database)
spring.data.mongodb.uri=mongodb://localhost:27017/bloodbank_db
spring.data.mongodb.auto-index-creation=true

# ML Service Microservice URL
ml.service.url=http://localhost:8000

# JWT Security Settings
# Supply a unique secret through the JWT_SECRET environment variable; the fallback is a placeholder only.
jwt.secret=${JWT_SECRET:CHANGE_ME_WITH_A_RANDOM_SECRET_OF_32_OR_MORE_CHARACTERS}
jwt.expiration=86400000
